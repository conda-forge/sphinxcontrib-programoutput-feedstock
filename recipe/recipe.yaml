schema_version: 1

context:
  name: sphinxcontrib-programoutput
  version: "0.20"
  python_min: "3.10"

package:
  name: ${{ name|lower }}
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/${{ name[0] }}/${{ name }}/${{ name | replace('-', '_') }}-${{ version }}.tar.gz
  sha256: 5c4282c1c7fc9b5a23febe16ae038b6392d7ce068d186ad4870ba22e74db0711

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv

requirements:
  host:
    - python ${{ python_min }}.*
    - pip
    - setuptools
  run:
    - python >=${{ python_min }}
    - sphinx >=5
    - docutils

tests:
  - python:
      imports:
        - sphinxcontrib.programoutput
      pip_check: true
      python_version: ${{ python_min }}.*

about:
  license: BSD-2-Clause
  license_file: LICENSE
  summary: Sphinx extension to include program output
  description: |
    A Sphinx extension to literally insert the output of arbitrary commands
    into documents, helping you to keep your command examples up to date.
  homepage: https://bitbucket.org/birkenfeld/sphinx-contrib
  repository: https://bitbucket.org/birkenfeld/sphinx-contrib
  documentation: https://sphinxcontrib-programoutput.readthedocs.org/

extra:
  recipe-maintainers:
    - holgern
    - anjos
